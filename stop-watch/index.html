<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stop-watch</title>

    <style>
        .main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        button {
            padding: 10px;
            background-color: green;
            color: whitesmoke;
            cursor: pointer;
        }

        .btn {
            display: flex;
            flex-direction: row;
            gap: 10px;
        }

    </style>
</head>

<body>
    <div class="main">
        <h1>Timer: <span id="showTime">00:00:00:00</span></h1>

        <div class="btn">
            <button id="startbtn">Start</button>
            <button id="pausebtn">Pause</button>
            <button id="resetbtn">Reset</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
